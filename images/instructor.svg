  <!-- 눈썹 -->
  <path d="M164 196 C172 190 184 190 192 194" fill="none" stroke="#3a2621" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M208 194 C216 190 228 190 236 196" fill="none" stroke="#3a2621" stroke-width="3.2" stroke-linecap="round"/>

  <!-- 눈 -->
  <ellipse cx="178" cy="214" rx="6.5" ry="7.5" fill="#2b1d1a"/>
