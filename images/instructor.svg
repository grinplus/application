<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Instructor illustration">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfeefd"/>
      <stop offset="1" stop-color="#eaf8ff"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fdbe8"/>
      <stop offset="1" stop-color="#1689a8"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2621"/>
      <stop offset="1" stop-color="#22140f"/>
    </linearGradient>
    <linearGradient id="blazer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#174b6d"/>
      <stop offset="1" stop-color="#0f3b57"/>
    </linearGradient>
  </defs>

  <!-- 배경: 하늘 + 바다 수평선 -->
  <rect width="400" height="500" fill="url(#sky)"/>
  <circle cx="318" cy="92" r="34" fill="#fff" opacity=".55"/>
  <rect y="300" width="400" height="200" fill="url(#sea)"/>
  <rect y="298" width="400" height="4" fill="#fff" opacity=".7"/>

  <!-- 뒷머리 -->
  <path d="M132 180 C118 250 112 330 104 400 C150 418 250 418 296 400 C288 330 282 250 268 180 Z" fill="url(#hair)"/>

