<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI & English Language Education</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F8FAFC'/%3E%3Ccircle cx='19' cy='13' r='8' fill='none' stroke='%231E40AF' stroke-width='2'/%3E%3Cpath d='M4 28 L28 4' stroke='%230F172A' stroke-width='1.5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 따라오는 헤더 -->
  <header class="header" id="top">
    <div class="header-inner">
      <a class="brand" href="#top" id="brand"></a>
      <div class="header-actions">
        <button class="admin-btn" id="adminBtn" type="button" aria-label="Admin" title="Admin">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="11" width="16" height="10" rx="2"/><path class="shackle" d="M8 11V7a4 4 0 0 1 8 0v4"/>
          </svg>
        </button>
      <button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false" aria-controls="nav">
        <span></span><span></span><span></span>
      </button>
      </div>
      <nav class="nav" id="nav" aria-label="Main menu"></nav>
    </div>
  </header>

  <!-- 수평선 히어로 -->
  <section class="hero" id="hero">
    <div class="hero-sky">
      <div class="hero-content" id="heroContent">
        <figure class="hero-figure" id="heroFigure" hidden><img id="heroImage" alt=""></figure>
        <div class="hero-main">
          <span class="badge" id="heroBadge"></span>
          <h1 id="heroTitle"></h1>
          <p class="hero-subtitle" id="heroSubtitle"></p>
          <p class="hero-text" id="heroText"></p>
          <div class="hero-actions">
            <a class="btn btn-lg" id="applyBtn" href="#"></a>
            <a class="btn btn-lg btn-light" id="curriculumBtn" href="#"></a>
          </div>
        </div>
      </div>
    </div>
    <div class="horizon" aria-hidden="true"></div>
    <div class="hero-sea" aria-hidden="true">
      <svg class="wave wave-1" viewBox="0 0 1440 60" preserveAspectRatio="none"><path d="M0,30 C240,10 480,50 720,30 C960,10 1200,50 1440,30 L1440,60 L0,60 Z"/></svg>
      <svg class="wave wave-2" viewBox="0 0 1440 60" preserveAspectRatio="none"><path d="M0,35 C200,50 440,15 720,35 C1000,55 1240,20 1440,35 L1440,60 L0,60 Z"/></svg>
    </div>
  </section>

  <main id="main"></main>

  <!-- 푸터: 교수자 소개 + 저작권 -->
  <footer class="footer" id="instructor">
    <div class="footer-inner" id="footerInstructor"></div>
    <p class="copyright" id="footerText"></p>
  </footer>

  <!-- 설정 파일을 먼저, 그 다음 화면 그리는 스크립트 -->
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="features.js"></script>
  <script src="admin.js"></script>
</body>
</html>
